<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan — Zyvenqo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .msg-layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 58px); padding-top: 58px; }
    .conv-list { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .conv-head { padding: 16px; border-bottom: 1px solid var(--border); }
    .conv-head h2 { font-weight: 800; font-size: 1rem; }
    .conv-items { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--border);
      position: relative;
    }
    .conv-item:hover { background: var(--bg3); }
    .conv-item.active { background: rgba(108,99,255,0.1); }
    .conv-item .unread-badge { position: absolute; top: 10px; right: 14px; background: var(--accent); color: #fff; border-radius: 10px; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; min-width: 18px; text-align: center; }

    .chat-area { display: flex; flex-direction: column; overflow: hidden; }
    .chat-head {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-head h3 { font-weight: 800; font-size: 0.95rem; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area {
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    .chat-input-area textarea {
      flex: 1; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 14px; color: var(--text); font-family: var(--font-main); font-size: 0.9rem;
      resize: none; outline: none; max-height: 120px; line-height: 1.5; transition: border-color 0.2s;
    }
    .chat-input-area textarea:focus { border-color: var(--accent); }
    .no-conv { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); }
    .no-conv i { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }

    @media (max-width: 768px) {
      .msg-layout { grid-template-columns: 1fr; }
      .conv-list { max-height: 260px; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="hamburger"><i class="fa-solid fa-bars"></i></button>
    <a href="dashboard.html" class="logo"><span>Zyv</span><span style="color:var(--text)">enqo</span></a>
    <nav style="margin-left:auto;">
      <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-house"></i></a>
    </nav>
  </header>

  <div class="msg-layout">
    <!-- CONVERSATION LIST -->
    <div class="conv-list">
      <div class="conv-head">
        <h2>Pesan</h2>
        <div class="search-bar" style="margin-top:10px;">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Cari pengguna..." id="userSearch" oninput="searchUsers()">
        </div>
        <div id="searchResults" style="margin-top:6px;"></div>
      </div>
      <div class="conv-items" id="convItems">
        <div style="padding:20px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="no-conv">
        <i class="fa-solid fa-comments"></i>
        <p>Pilih percakapan atau cari pengguna</p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const user = requireAuth();
    if (!user) throw new Error();

    let activeConv = null;
    let msgSubscription = null;
    let convUsers = {};

    async function loadConversations() {
      const { data: sent } = await sb.from('messages_Zyan').select('receiver_id').eq('sender_id', user.id);
      const { data: recv } = await sb.from('messages_Zyan').select('sender_id').eq('receiver_id', user.id);

      const uids = new Set([
        ...(sent||[]).map(m => m.receiver_id),
        ...(recv||[]).map(m => m.sender_id)
      ]);
      uids.delete(user.id);

      if (!uids.size) {
        document.getElementById('convItems').innerHTML = `<div style="padding:20px;text-align:center;font-size:0.82rem;color:var(--text3);">Belum ada percakapan.<br>Cari pengguna di atas untuk memulai.</div>`;
        return;
      }

      const { data: users } = await sb.from('users_Zyan').select('*').in('id', [...uids]);
      users?.forEach(u => convUsers[u.id] = u);

      // Get unread counts
      const convHtml = await Promise.all((users||[]).map(async u => {
        const { count } = await sb.from('messages_Zyan').select('*', { count: 'exact', head: true }).eq('sender_id', u.id).eq('receiver_id', user.id).eq('is_read', false);
        return { user: u, unread: count || 0 };
      }));

      document.getElementById('convItems').innerHTML = convHtml.map(({user: u, unread}) => `
        <div class="conv-item ${activeConv === u.id ? 'active' : ''}" onclick="openConv('${u.id}')">
          ${avatarHTML(u, 'md')}
          <div class="user-info">
            <div class="user-name">${escHtml(u.display_name || u.username)}</div>
            <div class="user-sub">@${escHtml(u.username)}</div>
          </div>
          ${unread ? `<span class="unread-badge">${unread}</span>` : ''}
        </div>
      `).join('');
    }

    async function openConv(userId) {
      activeConv = userId;
      const convUser = convUsers[userId] || (await sb.from('users_Zyan').select('*').eq('id', userId).single()).data;
      if (!convUser) return;
      convUsers[userId] = convUser;

      // Mark as read
      await sb.from('messages_Zyan').update({ is_read: true }).eq('sender_id', userId).eq('receiver_id', user.id);

      loadConversations();

      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = `
        <div class="chat-head">
          ${avatarHTML(convUser, 'sm')}
          <div>
            <h3>${escHtml(convUser.display_name || convUser.username)}</h3>
            <span style="font-size:0.78rem;color:var(--text3);">@${escHtml(convUser.username)}</span>
          </div>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input-area">
          <label style="cursor:pointer;color:var(--text3);padding:8px;">
            <i class="fa-solid fa-image" style="font-size:1.1rem;"></i>
            <input type="file" accept="image/*" style="display:none" onchange="sendImage(this, '${userId}')">
          </label>
          <textarea id="chatInput" placeholder="Tulis pesan..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage('${userId}');}"></textarea>
          <button class="btn btn-primary btn-icon" onclick="sendMessage('${userId}')"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      `;

      loadMessages(userId);
      subscribeMessages(userId);
    }

    async function loadMessages(toId) {
      const { data } = await sb.from('messages_Zyan').select('*')
        .or(`and(sender_id.eq.${user.id},receiver_id.eq.${toId}),and(sender_id.eq.${toId},receiver_id.eq.${user.id})`)
        .order('created_at');
      renderMessages(data || []);
    }

    function renderMessages(messages) {
      const body = document.getElementById('chatBody');
      if (!body) return;
      body.innerHTML = messages.map(m => {
        const mine = m.sender_id === user.id;
        const time = fmtTime(m.created_at);
        let content = '';
        if (m.media_url) {
          content = `<img src="${escHtml(m.media_url)}" style="max-width:240px;border-radius:8px;display:block;margin-bottom:4px;">`;
        }
        if (m.content) content += linkify(escHtml(m.content));
        return `
          <div class="msg-row ${mine ? 'mine' : ''}">
            ${!mine ? avatarHTML(convUsers[m.sender_id], 'sm') : ''}
            <div>
              <div class="msg-bubble">${content}</div>
              <div class="msg-meta">${time}</div>
            </div>
          </div>`;
      }).join('');
      body.scrollTop = body.scrollHeight;
    }

    function subscribeMessages(toId) {
      if (msgSubscription) sb.removeChannel(msgSubscription);
      msgSubscription = sb.channel(`dm-${user.id}-${toId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages_Zyan' }, payload => {
          const m = payload.new;
          if ((m.sender_id === user.id && m.receiver_id === toId) || (m.sender_id === toId && m.receiver_id === user.id)) {
            loadMessages(toId);
            if (m.sender_id === toId) sb.from('messages_Zyan').update({ is_read: true }).eq('id', m.id);
          }
        }).subscribe();
    }

    async function sendMessage(toId) {
      const inp = document.getElementById('chatInput');
      const content = inp.value.trim();
      if (!content) return;
      inp.value = '';
      await sb.from('messages_Zyan').insert({ sender_id: user.id, receiver_id: toId, content });
    }

    async function sendImage(input, toId) {
      if (!input.files[0]) return;
      const file = input.files[0];
      const path = `messages/${user.id}/${Date.now()}_${file.name}`;
      const { error } = await sb.storage.from('zyvenqo').upload(path, file);
      if (error) { toast('Gagal upload gambar!', 'error'); return; }
      const { data: urlData } = sb.storage.from('zyvenqo').getPublicUrl(path);
      await sb.from('messages_Zyan').insert({ sender_id: user.id, receiver_id: toId, media_url: urlData.publicUrl });
    }

    async function searchUsers() {
      const q = document.getElementById('userSearch').value.trim();
      if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
      const { data } = await sb.from('users_Zyan').select('*').neq('id', user.id).ilike('username', `%${q}%`).eq('status', 'active').limit(5);
      document.getElementById('searchResults').innerHTML = (data||[]).map(u => `
        <div class="user-item" onclick="startConv('${u.id}')">
          ${avatarHTML(u, 'sm')}
          <div class="user-info">
            <div class="user-name">${escHtml(u.display_name || u.username)}</div>
            <div class="user-sub">@${escHtml(u.username)}</div>
          </div>
        </div>
      `).join('');
    }

    async function startConv(userId) {
      document.getElementById('userSearch').value = '';
      document.getElementById('searchResults').innerHTML = '';
      const { data } = await sb.from('users_Zyan').select('*').eq('id', userId).single();
      if (data) { convUsers[userId] = data; }
      openConv(userId);
      loadConversations();
    }

    // Open from URL
    const toParam = new URLSearchParams(location.search).get('to');
    if (toParam) setTimeout(() => startConv(toParam), 500);

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    loadConversations();
  </script>
</body>
</html>
