<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Global — Zyvenqo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .gc-layout { display: grid; grid-template-columns: 1fr 260px; height: calc(100vh - 58px); padding-top: 58px; gap: 0; }
    .gc-main { display: flex; flex-direction: column; overflow: hidden; }
    .gc-head { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .gc-head h2 { font-weight: 800; font-size: 1rem; }
    .gc-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .gc-input-area { background: var(--bg2); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    .gc-input-area textarea { flex: 1; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-family: var(--font-main); font-size: 0.9rem; resize: none; outline: none; max-height: 120px; transition: border-color 0.2s; }
    .gc-input-area textarea:focus { border-color: var(--accent); }
    .gc-sidebar { background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    .gc-sidebar h3 { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); margin-bottom: 12px; }
    .online-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; flex-shrink: 0; }
    .day-divider { text-align: center; font-size: 0.75rem; color: var(--text3); margin: 8px 0; display: flex; align-items: center; gap: 8px; }
    .day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    @media (max-width: 768px) {
      .gc-layout { grid-template-columns: 1fr; }
      .gc-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="hamburger"><i class="fa-solid fa-bars"></i></button>
    <a href="dashboard.html" class="logo"><span>Zyv</span><span style="color:var(--text)">enqo</span></a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
      <span class="badge badge-success" id="onlineCount"><i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> 0 Online</span>
      <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-house"></i></a>
    </div>
  </header>

  <div class="gc-layout">
    <!-- MAIN CHAT -->
    <div class="gc-main">
      <div class="gc-head">
        <i class="fa-solid fa-globe" style="color:var(--accent2)"></i>
        <h2>Chat Global Zyvenqo</h2>
        <span style="font-size:0.78rem;color:var(--text3);margin-left:auto;">Semua pengguna dapat melihat pesan ini</span>
      </div>
      <div class="gc-body" id="gcBody">
        <div style="text-align:center;"><div class="spinner" style="display:inline-block;margin:30px auto;"></div></div>
      </div>
      <div class="gc-input-area">
        <label style="cursor:pointer;color:var(--text3);padding:8px;" title="Kirim gambar">
          <i class="fa-solid fa-image" style="font-size:1.1rem;"></i>
          <input type="file" accept="image/*" style="display:none" onchange="sendGcImage(this)">
        </label>
        <textarea id="gcInput" placeholder="Tulis pesan ke semua pengguna..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendGlobalMsg();}"></textarea>
        <button class="btn btn-primary btn-icon" onclick="sendGlobalMsg()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- SIDEBAR: ONLINE USERS -->
    <div class="gc-sidebar">
      <h3>Online Sekarang</h3>
      <div id="onlineList"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const user = requireAuth();
    if (!user) throw new Error();

    let gcSubscription = null;
    let userCache = {};
    userCache[user.id] = user;
    let lastDate = null;

    async function loadMessages() {
      const { data } = await sb.from('global_chat_Zyan').select('*').order('created_at').limit(150);
      const body = document.getElementById('gcBody');
      if (!data?.length) { body.innerHTML = `<div class="empty-state" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;"><i class="fa-solid fa-comments"></i><h3>Belum ada pesan</h3><p>Jadilah yang pertama!</p></div>`; return; }

      // Preload users
      const uids = [...new Set(data.map(m => m.user_id))];
      const { data: users } = await sb.from('users_Zyan').select('*').in('id', uids);
      (users||[]).forEach(u => userCache[u.id] = u);

      lastDate = null;
      body.innerHTML = data.map(m => renderMsg(m)).join('');
      body.scrollTop = body.scrollHeight;
    }

    function renderMsg(m) {
      const u = userCache[m.user_id] || { username: 'Pengguna', display_name: '' };
      const mine = m.user_id === user.id;
      const time = fmtTime(m.created_at);
      const date = new Date(m.created_at).toLocaleDateString('id-ID');
      let divider = '';
      if (date !== lastDate) { divider = `<div class="day-divider">${date}</div>`; lastDate = date; }

      let content = '';
      if (m.media_url) content += `<img src="${escHtml(m.media_url)}" style="max-width:280px;border-radius:8px;display:block;margin-bottom:4px;">`;
      if (m.content) content += linkify(escHtml(m.content));

      return `${divider}<div class="msg-row ${mine ? 'mine' : ''}">
        ${!mine ? avatarHTML(u, 'sm') : ''}
        <div>
          ${!mine ? `<div style="font-size:0.73rem;font-weight:700;color:var(--accent);margin-bottom:3px;">${escHtml(u.display_name || u.username)}</div>` : ''}
          <div class="msg-bubble">${content}</div>
          <div class="msg-meta">${time}</div>
        </div>
      </div>`;
    }

    async function sendGlobalMsg() {
      const inp = document.getElementById('gcInput');
      const content = inp.value.trim();
      if (!content) return;
      inp.value = '';
      await sb.from('global_chat_Zyan').insert({ user_id: user.id, content });
    }

    async function sendGcImage(input) {
      if (!input.files[0]) return;
      const file = input.files[0];
      const path = `global/${user.id}/${Date.now()}_${file.name}`;
      const { error } = await sb.storage.from('zyvenqo').upload(path, file);
      if (error) { toast('Gagal upload!', 'error'); return; }
      const { data: urlData } = sb.storage.from('zyvenqo').getPublicUrl(path);
      await sb.from('global_chat_Zyan').insert({ user_id: user.id, media_url: urlData.publicUrl });
    }

    function subscribeGC() {
      gcSubscription = sb.channel('global-chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_chat_Zyan' }, async payload => {
          const m = payload.new;
          if (!userCache[m.user_id]) {
            const { data } = await sb.from('users_Zyan').select('*').eq('id', m.user_id).single();
            if (data) userCache[m.user_id] = data;
          }
          const body = document.getElementById('gcBody');
          body.innerHTML += renderMsg(m);
          body.scrollTop = body.scrollHeight;
        }).subscribe();
    }

    async function loadOnlineUsers() {
      const fiveMinAgo = new Date(Date.now() - 5 * 60000).toISOString();
      const { data } = await sb.from('users_Zyan').select('*').eq('status', 'active').gte('last_seen', fiveMinAgo).limit(20);
      document.getElementById('onlineCount').innerHTML = `<i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> ${data?.length || 0} Online`;
      document.getElementById('onlineList').innerHTML = (data||[]).map(u => `
        <div class="user-item" onclick="window.location.href='messages.html?to=${u.id}'" style="padding:8px 0;">
          <div style="position:relative;">
            ${avatarHTML(u, 'sm')}
            <div class="online-dot" style="position:absolute;bottom:0;right:0;border:2px solid var(--bg2);"></div>
          </div>
          <div class="user-info">
            <div class="user-name" style="font-size:0.85rem;">${escHtml(u.display_name || u.username)}</div>
          </div>
        </div>
      `).join('');
    }

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Update last seen
    sb.from('users_Zyan').update({ last_seen: new Date().toISOString() }).eq('id', user.id);

    loadMessages();
    subscribeGC();
    loadOnlineUsers();
    setInterval(loadOnlineUsers, 30000);
    setInterval(() => sb.from('users_Zyan').update({ last_seen: new Date().toISOString() }).eq('id', user.id), 60000);
  </script>
</body>
</html>
